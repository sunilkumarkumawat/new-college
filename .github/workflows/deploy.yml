name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Native SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          # 1. Validate Secrets
          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST secret is missing or empty in GitHub Secrets!"
            exit 1
          fi

          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH_KEY secret is missing or empty in GitHub Secrets!"
            exit 1
          fi

          DEPLOY_USER="${SSH_USER:-root}"
          DEPLOY_PORT="${SSH_PORT:-22}"
          TARGET="${TARGET_DIR:-/var/www/girraj.rusoft.in}"

          # 2. Setup SSH Key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python3 -c "
          import os, sys
          raw = os.environ.get('SSH_KEY', '')
          lines = [line.strip() for line in raw.splitlines() if line.strip()]
          print(f'INFO: Secret raw len={len(raw)}, non-empty lines={len(lines)}')
          for idx, line in enumerate(lines):
              print(f'  Line {idx}: len={len(line)} prefix={line[:12]} suffix={line[-12:]}')
          clean_key = '\n'.join(lines) + '\n'
          key_path = os.path.expanduser('~/.ssh/id_deploy')
          with open(key_path, 'w', newline='\n') as f:
              f.write(clean_key)
          "
          chmod 600 ~/.ssh/id_deploy

          # Inspect OpenSSH load error
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub || {
            echo "::error::Failed to parse private key with ssh-keygen"
            ssh-keygen -y -f ~/.ssh/id_deploy 2>&1 || true
            exit 1
          }

          echo "=== Connecting to $DEPLOY_USER@$SSH_HOST on port $DEPLOY_PORT ==="

          # 3. Execute Deployment Commands on VPS
          ssh -v -o StrictHostKeyChecking=no -p "$DEPLOY_PORT" -i ~/.ssh/id_deploy "$DEPLOY_USER@$SSH_HOST" "bash -s" << EOF
            set -e
            echo "=== Target Directory: $TARGET ==="
            cd "$TARGET"
            git pull origin master
            composer install --no-dev --optimize-autoloader --ignore-platform-reqs
            mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo "=== Deployment Completed Successfully ==="
          EOF
