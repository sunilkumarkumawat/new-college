name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Native SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          # 1. Validate Secrets
          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST secret is missing or empty in GitHub Secrets!"
            exit 1
          fi

          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH_KEY secret is missing or empty in GitHub Secrets!"
            exit 1
          fi

          DEPLOY_USER="${SSH_USER:-root}"
          DEPLOY_PORT="${SSH_PORT:-22}"
          TARGET="${TARGET_DIR:-/var/www/girraj.rusoft.in}"

          # 2. Setup SSH Key with clean Unix newlines
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python3 -c "
          import os
          raw = os.environ.get('SSH_KEY', '')
          lines = [line.strip() for line in raw.splitlines() if line.strip()]
          clean_key = '\n'.join(lines) + '\n'
          with open(os.path.expanduser('~/.ssh/id_deploy'), 'w') as f:
              f.write(clean_key)
          "
          chmod 600 ~/.ssh/id_deploy

          # Generate matching public key so OpenSSH does not invoke libcrypto key-derivation parser
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub 2>/dev/null || true
          if [ -f ~/.ssh/id_deploy.pub ]; then
            chmod 644 ~/.ssh/id_deploy.pub
            echo "Public key derived successfully: $(cat ~/.ssh/id_deploy.pub)"
          fi

          echo "=== Connecting to $DEPLOY_USER@$SSH_HOST on port $DEPLOY_PORT ==="

          # 3. Execute Deployment Commands on VPS
          ssh -o StrictHostKeyChecking=no -p "$DEPLOY_PORT" -i ~/.ssh/id_deploy "$DEPLOY_USER@$SSH_HOST" "bash -s" << EOF
            set -e
            echo "=== Target Directory: $TARGET ==="
            cd "$TARGET"
            git pull origin master
            composer install --no-dev --optimize-autoloader --ignore-platform-reqs
            mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo "=== Deployment Completed Successfully ==="
          EOF
