name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || secrets.HOST }}
          username: ${{ secrets.SSH_USER || secrets.USERNAME || 'root' }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || secrets.PORT || '22' }}
          script: |
            TARGET="${{ secrets.TARGET_DIR || '/var/www/girraj.rusoft.in' }}"
            echo "=== Deploying to directory: $TARGET ==="
            cd "$TARGET"
            git pull origin master
            composer install --no-dev --optimize-autoloader --ignore-platform-reqs
            mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo "=== Deployment Completed Successfully ==="
