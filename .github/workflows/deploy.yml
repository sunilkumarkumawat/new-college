name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Native SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          # 1. Validate Secrets
          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST secret is missing or empty in GitHub Secrets!"
            exit 1
          fi

          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH_KEY secret is missing or empty in GitHub Secrets!"
            exit 1
          fi

          DEPLOY_USER="${SSH_USER:-root}"
          DEPLOY_PORT="${SSH_PORT:-22}"
          TARGET="${TARGET_DIR:-/var/www/girraj.rusoft.in}"

          # 2. Setup SSH Key with automatic Header & Footer formatting
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python3 -c "
          import os
          raw = os.environ.get('SSH_KEY', '').strip()
          lines = [line.strip() for line in raw.splitlines() if line.strip()]
          
          # Auto-wrap if header/footer was omitted when pasted
          if not any('BEGIN' in line for line in lines):
              lines.insert(0, '-----BEGIN OPENSSH PRIVATE KEY-----')
          if not any('END' in line for line in lines):
              lines.append('-----END OPENSSH PRIVATE KEY-----')

          clean_key = '\n'.join(lines) + '\n'
          key_path = os.path.expanduser('~/.ssh/id_deploy')
          with open(key_path, 'w', newline='\n') as f:
              f.write(clean_key)
          print('INFO: Private key constructed successfully with header and footer.')
          "
          chmod 600 ~/.ssh/id_deploy

          # Generate public key
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub
          chmod 644 ~/.ssh/id_deploy.pub
          echo "Public key verified: $(cat ~/.ssh/id_deploy.pub)"

          echo "=== Connecting to $DEPLOY_USER@$SSH_HOST on port $DEPLOY_PORT ==="

          # 3. Execute Deployment Commands on VPS
          ssh -o StrictHostKeyChecking=no -p "$DEPLOY_PORT" -i ~/.ssh/id_deploy "$DEPLOY_USER@$SSH_HOST" "bash -s" << EOF
            set -e
            echo "=== Target Directory: $TARGET ==="
            cd "$TARGET"
            git pull origin master
            composer install --no-dev --optimize-autoloader --ignore-platform-reqs
            mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache
            #php artisan config:cache
            #php artisan route:cache
            #php artisan view:cache
            php artisan optimize:clear
            echo "=== Deployment Completed Successfully ==="
          EOF
